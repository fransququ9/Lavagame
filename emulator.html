<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Retro Player</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div style="width:100vw;height:100vh;">
    <div id="game"></div>
  </div>

  <script>
    // Konfigurasi sistem konsol dan letak file ROM
    EJS_player = '#game';
    EJS_core = 'gba'; // Ganti sesuai konsol: 'gba', 'psx', 'psp', 'snes', 'nds'
    EJS_gameUrl = './roms/Pokemon emerald.gba'; // Path ke file ROM game kamu
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // Library core WASM
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
