<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Judul yang menarik dan mengandung kata kunci pencarian -->
  <title>LavaGame - Main Game Online Gratis & Game 2 Player Seru</title>
  
  <!-- Deskripsi untuk snippet pencarian Google -->
  <meta name="description" content="Mainkan ratusan game online gratis di LavaGame! Pilihan game 2 player 1 keyboard, balap mobil Drive Mad, basket, arcade, dan game horor 3D langsung di browser tanpa unduh.">
  <meta name="keywords" content="lavagame, game online gratis, game 2 player, main game di browser, drive mad online, basket random, poki alternatif">
  <meta name="author" content="LavaGame">

  <!-- Open Graph (Tampilan kartu saat link dibagikan ke WhatsApp / medsos) -->
  <meta property="og:title" content="LavaGame - Portal Game Online Gratis">
  <meta property="og:description" content="Koleksi game browser seru: 2 Player, Balapan, Olahraga, dan Horor 3D tanpa install!">
  <meta property="og:type" content="website">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Navigasi -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">🔥</span>
      <span class="logo-text">Lava<span class="highlight">Game</span></span>
    </div>
    <input type="text" id="searchInput" placeholder="Cari game seru..." onkeyup="filterGames()">
  </header>

  <!-- Kontainer Grid Game -->
  <main class="container">
    <div class="game-grid" id="gameGrid"></div>
  </main>

  <!-- Modal Player Game -->
  <div id="gameModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalGameTitle">Nama Game</span>
        <div class="header-actions">
          <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
          <button class="close-btn" onclick="closeGame()">&times; Tutup</button>
        </div>
      </div>
      <iframe id="gameIframe" src="" frameborder="0" allow="autoplay; gamepad; fullscreen; screen-wake-lock; pointer-lock" allowfullscreen></iframe>
    </div>
  </div>

  <script>

      {

        url: "https://nebezb.com/floppybird/"
      },
      {

        title: "Basketball Stars",
        category: "2 Player",
        thumbnail: "https://images.unsplash.com/photo-1546519638-68e109498ffc?w=400&q=80",
        url: "https://ubg98.github.io/BasketballStars/"
      },
      {
        id: "drive-mad",
        title: "Drive Mad",
        category: "Driving",
        thumbnail: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=400&q=80",
        url: "https://ubg98.github.io/DriveMad/"
      },
      {
        id: "moto-x3m",
        title: "Moto X3M",

        thumbnail: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=400&q=80",
        url: "https://html5.gamedistribution.com/bcacf81441bd4c7799a622171116ea9d/"
      },
      {
        id: "granny-horror",
        title: "Granny Horror 3D",
        category: "Horror",
        thumbnail: "https://images.unsplash.com/photo-1509248961158-e54f6934749c?w=400&q=80",
        url: "https://html5.gamedistribution.com/2a658c392b23482986d1e55ec04b7844/"
      },
      {

       title: "Slope 3D",

      {

      },
      {
        id: "dino",
        title: "T-Rex Runner",
        category: "Arcade",
        thumbnail: "https://images.unsplash.com/photo-1551103782-8ab07afd45c1?w=400&q=80",
        url: "https://chromedino.com/"
      } 
    ];

    const grid = document.getElementById("gameGrid");

    function renderGames(list) {
      grid.innerHTML = "";
      list.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.onclick = () => openGame(game.title, game.url);
        card.innerHTML = `
          <img src="${game.thumbnail}" alt="${game.title}">
          <div class="game-info">
            <span class="title">${game.title}</span>
            <span class="category">${game.category}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openGame(title, url) {
      document.getElementById("modalGameTitle").innerText = title;
      document.getElementById("gameIframe").src = url;
      document.getElementById("gameModal").style.display = "flex";
    }

    function closeGame() {
      document.getElementById("gameModal").style.display = "none";
      document.getElementById("gameIframe").src = "";
    }

    // --- FUNGSI FULLSCREEN DITARUH DI SINI ---
    function toggleFullScreen() {
      const modal = document.getElementById("gameModal");
      if (!document.fullscreenElement) {
        if (modal.requestFullscreen) {
          modal.requestFullscreen();
        } else if (modal.webkitRequestFullscreen) {
          modal.webkitRequestFullscreen();
        } else if (modal.msRequestFullscreen) {
          modal.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function filterGames() {
      const keyword = document.getElementById("searchInput").value.toLowerCase();
      const filtered = games.filter(g => 
        g.title.toLowerCase().includes(keyword) || 
        g.category.toLowerCase().includes(keyword)
      );
      renderGames(filtered);
    }

    renderGames(games);
  </script>
</body>
</html>
