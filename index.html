    /* Styling tombol filter kategori */
    .category-bar {
      display: flex;
      gap: 10px;
      padding: 12px 24px;
      overflow-x: auto;
      scrollbar-width: none;
      max-width: 1200px;
      margin: 0 auto;
    }
    .category-bar::-webkit-scrollbar {
      display: none;
    }
    .cat-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .cat-btn:hover {
      background: #334155;
      color: #ffffff;
    }
    .cat-btn.active {
      background: #f97316;
      color: #ffffff;
      border-color: #f97316;
    }

      <span class="logo-text">Lava<span class="highlight">Game</span></span>
    </div>
    <input type="text" id="searchInput" placeholder="Cari game seru..." onkeyup="filterGames()">
  </header>

  <!-- Tombol Filter Kategori -->
  <div class="category-bar">
    <button class="cat-btn active" onclick="setCategory('All', this)">Semua</button>
    <button class="cat-btn" onclick="setCategory('Retro', this)">GBA Retro</button>
    <button class="cat-btn" onclick="setCategory('Horror', this)">Horror</button>
    <button class="cat-btn" onclick="setCategory('Fun', this)">Fun / Casual</button>
    <button class="cat-btn" onclick="setCategory('2 Player', this)">2 Player</button>
  </div>

  <!-- Kontainer Grid Game -->

    <div class="game-grid" id="gameGrid"></div>
  </main>

      </div>

    const grid = document.getElementById("gameGrid");
    let activeCategory = 'All';

    function renderGames(list) {
      grid.innerHTML = "";
      list.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.onclick = () => openGame(game.title, game.url);
        card.innerHTML = `
          <img src="${game.thumbnail}" alt="${game.title}">
          <div class="game-info">
            <span class="title">${game.title}</span>
            <span class="category">${game.category}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openGame(title, url) {
      document.getElementById("modalGameTitle").innerText = title;
      document.getElementById("gameIframe").src = url;
      document.getElementById("gameModal").style.display = "flex";
    }

    function closeGame() {
      document.getElementById("gameModal").style.display = "none";
      document.getElementById("gameIframe").src = "";
    }

    // --- FUNGSI FULLSCREEN DITARUH DI SINI ---
    function toggleFullScreen() {
      const modal = document.getElementById("gameModal");
      if (!document.fullscreenElement) {
        if (modal.requestFullscreen) {
          modal.requestFullscreen();
        } else if (modal.webkitRequestFullscreen) {
          modal.webkitRequestFullscreen();
        } else if (modal.msRequestFullscreen) {
          modal.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Fungsi klik tombol kategori
    function setCategory(cat, element) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      filterGames();
    }

    // Fungsi filter gabungan pencarian dan kategori
    function filterGames() {
      const keyword = document.getElementById("searchInput").value.toLowerCase();
      
      const filtered = games.filter(g => {
        const matchSearch = g.title.toLowerCase().includes(keyword) || g.category.toLowerCase().includes(keyword);
        
        let matchCategory = false;
        if (activeCategory === 'All') {
          matchCategory = true;
        } else if (activeCategory === 'Fun') {
          // Menggabungkan genre santai ke dalam kategori Fun
          matchCategory = ['Arcade', 'Driving', 'Action', 'Puzzle', 'Multiplayer'].includes(g.category);
        } else {
          matchCategory = g.category.toLowerCase() === activeCategory.toLowerCase();
        }

        return matchSearch && matchCategory;
      });

      renderGames(filtered);
    }

    renderGames(games);
