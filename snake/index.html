<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      font-family: sans-serif;
    }
    h3 { margin-bottom: 10px; color: #38bdf8; }
    .game-wrapper {
      position: relative;
      width: 400px;
      height: 400px;
    }
    canvas {
      background-color: #020617;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .btn {
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 6px;
      color: #0f172a;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover {
      background: #0ea5e9;
      transform: scale(1.05);
    }
    p { margin-top: 10px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <h3>Skor: <span id="score">0</span></h3>

  <div class="game-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <!-- Tampilan Menu Mulai / Kalah di Atas Canvas -->
    <div id="overlay" class="overlay">
      <h2 id="statusText">Retro Snake</h2>
      <button class="btn" id="startBtn" onclick="startGame()">Mulai Main</button>
    </div>
  </div>

  <p>Gunakan tombol Panah (Arrow Keys) untuk bergerak</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const statusText = document.getElementById("statusText");
    const startBtn = document.getElementById("startBtn");
    const scoreElem = document.getElementById("score");

    const grid = 20;
    let snake, dx, dy, food, score, loopInterval;
    let isPlaying = false;

    function initGame() {
      snake = [{ x: 160, y: 160 }, { x: 140, y: 160 }, { x: 120, y: 160 }];
      dx = grid;
      dy = 0;
      score = 0;
      scoreElem.innerText = score;
      spawnFood();
      drawStatic();
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
        y: Math.floor(Math.random() * (canvas.height / grid)) * grid
      };
    }

    function drawStatic() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(food.x, food.y, grid - 2, grid - 2);

      ctx.fillStyle = "#22c55e";
      snake.forEach((part, i) => {
        ctx.fillStyle = i === 0 ? "#4ade80" : "#16a34a";
        ctx.fillRect(part.x, part.y, grid - 2, grid - 2);
      });
    }

    function update() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Cek tabrakan dinding
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return gameOver();
      }

      // Cek tabrakan badan
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      // Cek makan makanan
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElem.innerText = score;
        spawnFood();
      } else {
        snake.pop();
      }

      drawStatic();
    }

    function startGame() {
      initGame();
      isPlaying = true;
      overlay.style.display = "none";
      clearInterval(loopInterval);
      loopInterval = setInterval(update, 120);
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(loopInterval);
      statusText.innerText = "Game Over! Skor: " + score;
      startBtn.innerText = "Main Lagi";
      overlay.style.display = "flex";
    }

    window.addEventListener("keydown", e => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
      }
      if (!isPlaying) return;

      if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -grid; }
      if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = grid; }
      if (e.key === "ArrowLeft" && dx === 0) { dx = -grid; dy = 0; }
      if (e.key === "ArrowRight" && dx === 0) { dx = grid; dy = 0; }
    });

    initGame();
  </script>
</body>
</html>
