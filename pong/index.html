<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pong 2 Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #0b0f19; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #fff; }
    h2 { margin-bottom: 12px; color: #38bdf8; }
    canvas { background: #020617; border: 2px solid #38bdf8; border-radius: 8px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
    .controls-hint { margin-top: 12px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <h2>P1 (Biru): <span id="s1">0</span> | P2 (Merah): <span id="s2">0</span></h2>
  <canvas id="c" width="600" height="350"></canvas>
  <div class="controls-hint">Kontrol: P1 (W / S) | P2 (Panah Atas / Bawah)</div>

  <script>
    const cvs = document.getElementById("c");
    const ctx = cvs.getContext("2d");
    let p1 = 135, p2 = 135, s1 = 0, s2 = 0;
    let bx = 300, by = 175, bdx = 4, bdy = 3;
    let keys = {};

    window.onkeydown = e => { 
      if (["ArrowUp", "ArrowDown", "w", "s", "W", "S"].includes(e.key)) e.preventDefault();
      keys[e.key] = true; 
    };
    window.onkeyup = e => { keys[e.key] = false; };

    function loop() {
      // Gerak P1 (W / S)
      if (keys["w"] || keys["W"]) p1 = Math.max(0, p1 - 5);
      if (keys["s"] || keys["S"]) p1 = Math.min(270, p1 + 5);

      // Gerak P2 (Arrow Up / Down)
      if (keys["ArrowUp"]) p2 = Math.max(0, p2 - 5);
      if (keys["ArrowDown"]) p2 = Math.min(270, p2 + 5);

      // Pantulan Dinding Atas / Bawah
      bx += bdx; by += bdy;
      if (by <= 5 || by >= 345) bdy = -bdy;

      // Pantulan Raket P1
      if (bx <= 25 && by >= p1 && by <= p1 + 80) {
        bdx = Math.abs(bdx) + 0.2;
      }
      // Pantulan Raket P2
      if (bx >= 575 && by >= p2 && by <= p2 + 80) {
        bdx = -(Math.abs(bdx) + 0.2);
      }

      // Hitung Skor
      if (bx < 0) { s2++; reset(); }
      if (bx > 600) { s1++; reset(); }

      // Gambar Arena
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, 600, 350);

      // Garis Lapangan Tengah
      ctx.strokeStyle = "#1e293b";
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(300, 0); ctx.lineTo(300, 350);
      ctx.stroke();
      ctx.setLineDash([]);

      // Raket P1 & P2
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(15, p1, 10, 80);
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(575, p2, 10, 80);

      // Bola
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(bx, by, 7, 0, Math.PI * 2);
      ctx.fill();

      document.getElementById("s1").innerText = s1;
      document.getElementById("s2").innerText = s2;
      requestAnimationFrame(loop);
    }

    function reset() {
      bx = 300; by = 175;
      bdx = (Math.random() > 0.5 ? 4 : -4);
      bdy = (Math.random() > 0.5 ? 3 : -3);
    }

    loop();
  </script>
</body>
</html>
